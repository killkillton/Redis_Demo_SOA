services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
  memcached:
    image: memcached:alpine
    ports:
      - "11211:11211"